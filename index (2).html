<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Arrab — Account Management System</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ══════════════════════════════════════════════
   TOKENS
══════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sidebar-w:228px;
  --header-h:54px;
  --font:'IBM Plex Sans Arabic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --bg:#f0f2f7;
  --surface:#ffffff;
  --border:#e2e5ef;
  --text:#111827;
  --muted:#6b7280;
  --accent:#2563eb;
  --accent-light:#eff6ff;
  --accent-dark:#1d4ed8;
  --success:#059669;
  --success-bg:#ecfdf5;
  --warn:#d97706;
  --warn-bg:#fffbeb;
  --danger:#dc2626;
  --danger-bg:#fef2f2;
  --vip:#7c3aed;
  --vip-bg:#f5f3ff;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --r:8px;
  --r-lg:12px;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.5;min-height:100vh}
#app{display:flex;height:100vh;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;overflow-x:hidden}
.sb-brand{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-logo{width:34px;height:34px;background:var(--accent);border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;letter-spacing:-.5px}
.sb-brand-text{line-height:1.25}
.sb-brand-name{font-size:13px;font-weight:700;color:var(--text)}
.sb-brand-sub{font-size:10.5px;color:var(--muted)}
.sb-section{padding:14px 14px 4px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.9px;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 12px;margin:1px 6px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--muted);transition:all .14s;font-weight:500;user-select:none}
.sb-item:hover{background:var(--bg);color:var(--text)}
.sb-item.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.sb-item svg{width:15px;height:15px;flex-shrink:0}
.sb-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center;line-height:1.6}
.sb-badge.b-warn{background:var(--warn)}
.sb-badge.b-info{background:var(--accent)}
.sb-footer{margin-top:auto;padding:12px 10px;border-top:1px solid var(--border)}
.sb-user{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--bg);border-radius:var(--r)}
.sb-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.sb-user-info{line-height:1.3}
.sb-user-name{font-size:12px;font-weight:600}
.sb-user-role{font-size:10px;color:var(--muted)}

/* ── MAIN ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0}
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-date{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tb-notif{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);transition:.14s}
.tb-notif:hover{background:var(--bg)}
.tb-notif svg{width:15px;height:15px;color:var(--muted)}
.tb-notif-dot{position:absolute;top:5px;right:5px;width:7px;height:7px;background:var(--danger);border-radius:50%;border:1.5px solid #fff}
.tb-btn{padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);transition:.14s;display:none}
.tb-btn:hover{background:var(--accent-dark)}
.tb-sync{padding:6px 12px;background:var(--surface);color:var(--muted);border:1px solid var(--border);border-radius:var(--r);font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:5px;transition:.14s}
.tb-sync:hover{background:var(--bg);color:var(--text)}
.tb-sync.syncing svg{animation:spin .7s linear infinite}

#content{flex:1;overflow-y:auto;padding:20px;overflow-x:hidden}

/* ── STAT CARDS ── */
.stat-grid{display:grid;gap:12px;margin-bottom:16px}
.g-4{grid-template-columns:repeat(4,1fr)}
.g-5{grid-template-columns:repeat(5,1fr)}
.g-3{grid-template-columns:repeat(3,1fr)}
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:15px 16px;border:1px solid var(--border);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card.clickable{cursor:pointer;transition:.15s}
.stat-card.clickable:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.stat-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;color:var(--text);line-height:1.1;font-family:var(--mono)}
.stat-sub{font-size:11.5px;color:var(--muted);margin-top:4px}
.stat-icon{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.stat-icon svg{width:16px;height:16px}
.si-blue{background:var(--accent-light);color:var(--accent)}
.si-green{background:var(--success-bg);color:var(--success)}
.si-warn{background:var(--warn-bg);color:var(--warn)}
.si-danger{background:var(--danger-bg);color:var(--danger)}
.si-vip{background:var(--vip-bg);color:var(--vip)}

/* ── CARDS ── */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;color:var(--text)}
.chart-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}

/* ── TABLE ── */
.tbl-wrap{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.tbl-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.tbl-title{font-size:14px;font-weight:700;flex:1;min-width:200px}
.tbl-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbl-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:700px}
th{background:#f8f9fc;padding:9px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--accent)}
td{padding:9px 12px;border-bottom:1px solid #f1f3f9;color:var(--text);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
tr.row-danger td{background:#fff8f8}
tr.row-warn td{background:#fffdf0}
tr.row-success td{background:#f8fffe}

/* ── INPUTS ── */
input[type=text],input[type=date],input[type=number],select,textarea{
  padding:7px 10px;border:1px solid var(--border);border-radius:var(--r);
  font-size:13px;font-family:var(--font);color:var(--text);background:var(--surface);
  outline:none;transition:.14s
}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,
select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
input[type=text]{min-width:180px}
select{min-width:130px}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.b-active{background:var(--success-bg);color:var(--success)}
.b-inactive{background:#f1f5f9;color:var(--muted)}
.b-vip{background:var(--vip-bg);color:var(--vip)}
.b-normal{background:#f1f5f9;color:#475569}
.b-pending{background:var(--warn-bg);color:var(--warn)}
.b-delayed,.b-overdue,.b-missed,.b-lost{background:var(--danger-bg);color:var(--danger)}
.b-submitted,.b-paid,.b-done,.b-renewed{background:var(--success-bg);color:var(--success)}
.b-partial{background:#dbeafe;color:#1d4ed8}
.b-onhold{background:#f1f5f9;color:#64748b}
.b-cancelled{background:#f1f5f9;color:#94a3b8}
.b-seo{background:#d1fae5;color:#065f46}
.b-socialmedia,.b-social{background:#dbeafe;color:#1d4ed8}
.b-ads{background:#fee2e2;color:#991b1b}
.b-website{background:#ede9fe;color:#5b21b6}
.b-today{background:#fffbeb;color:#92400e;border:1px solid #fcd34d}
.b-upcoming{background:#f0fdf4;color:#166534}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.pg-btn{padding:4px 10px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);cursor:pointer;font-size:12px;font-family:var(--font);transition:.13s}
.pg-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pg-btn:hover:not(.active){background:var(--bg)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--surface);border-radius:var(--r-lg);padding:24px;width:560px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.modal-close{cursor:pointer;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:4px;transition:.13s}
.modal-close:hover{background:var(--bg);color:var(--text)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-field{display:flex;flex-direction:column;gap:5px}
.form-field.full{grid-column:1/-1}
.form-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.form-field input,.form-field select,.form-field textarea{padding:8px 10px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-family:var(--font);color:var(--text);width:100%;outline:none}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.btn{padding:8px 18px;border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);border:none;transition:.14s}
.btn-cancel{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn-cancel:hover{background:var(--bg)}
.btn-save{background:var(--accent);color:#fff}
.btn-save:hover{background:var(--accent-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#b91c1c}

/* ── ALERTS ── */
.alert-bar{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r);font-size:12.5px;font-weight:500;margin-bottom:8px}
.alert-danger{background:#fff5f5;border:1px solid #fecaca;color:#991b1b}
.alert-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert-bar svg{width:14px;height:14px;flex-shrink:0}

/* ── PERF ROWS ── */
.mgr-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.mgr-row:last-child{border:none}
.mgr-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex-shrink:0}
.mgr-info{flex:1;min-width:0}
.mgr-name{font-weight:600;font-size:13px}
.mgr-sub{font-size:11px;color:var(--muted)}
.pbar{height:5px;background:#e5e7eb;border-radius:4px;overflow:hidden;margin-top:5px;width:160px}
.pfill{height:100%;border-radius:4px;background:var(--accent);transition:width .4s}
.mgr-nums{display:flex;gap:16px;flex-shrink:0}
.mgr-num{text-align:center}
.mgr-num-val{font-size:15px;font-weight:700;font-family:var(--mono)}
.mgr-num-lbl{font-size:10px;color:var(--muted);font-weight:500}

/* ── EMPTY ── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px;color:var(--muted);text-align:center;gap:8px}
.empty-icon{font-size:36px;opacity:.3}

/* ── LOADING ── */
.loader{display:flex;align-items:center;justify-content:center;height:220px;color:var(--muted);gap:8px;font-size:13px}
.spin-ring{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.spin-ring,.tb-sync.syncing svg{animation:spin .7s linear infinite}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;right:24px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast-item{padding:10px 16px;border-radius:var(--r);font-size:13px;font-weight:500;box-shadow:var(--shadow-md);animation:slideIn .2s ease;max-width:320px}
.toast-success{background:#059669;color:#fff}
.toast-error{background:#dc2626;color:#fff}
.toast-info{background:#2563eb;color:#fff}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── CONFIG BANNER ── */
#config-banner{display:flex;align-items:center;justify-content:space-between;background:#fff7ed;border:1px solid #fed7aa;border-radius:var(--r);padding:10px 16px;margin-bottom:16px;font-size:13px;color:#9a3412}
#config-banner strong{font-weight:700}
#config-banner input{padding:5px 9px;border:1px solid #fdba74;border-radius:6px;font-size:12px;width:320px;font-family:var(--mono)}
#config-banner button{padding:5px 14px;background:#ea580c;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
</style>
</head>
<body>

<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">AA</div>
      <div class="sb-brand-text">
        <div class="sb-brand-name">Al Arrab Agency</div>
        <div class="sb-brand-sub">Account Management</div>
      </div>
    </div>

    <div style="padding:6px 0 4px">
      <div class="sb-section">Main</div>
      <div class="sb-item active" data-page="dashboard" onclick="nav('dashboard')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </div>

      <div class="sb-section">Management</div>
      <div class="sb-item" data-page="clients" onclick="nav('clients')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients
        <span class="sb-badge b-info" id="badge-clients">—</span>
      </div>
      <div class="sb-item" data-page="reports" onclick="nav('reports')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>
        Reports
        <span class="sb-badge" id="badge-reports">—</span>
      </div>
      <div class="sb-item" data-page="followups" onclick="nav('followups')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Follow-ups
        <span class="sb-badge b-warn" id="badge-followups">—</span>
      </div>
      <div class="sb-item" data-page="renewals" onclick="nav('renewals')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Renewals
        <span class="sb-badge b-warn" id="badge-renewals">—</span>
      </div>
      <div class="sb-item" data-page="contracts" onclick="nav('contracts')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="12" y1="17" x2="8" y2="17"/></svg>
        Contracts
        <span class="sb-badge" id="badge-contracts">—</span>
      </div>

      <div class="sb-section">Analytics</div>
      <div class="sb-item" data-page="performance" onclick="nav('performance')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Performance
      </div>
      <div class="sb-item" data-page="team" onclick="nav('team')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Team
      </div>
    </div>

    <div class="sb-footer">
      <div class="sb-user">
        <div class="sb-avatar" id="user-av">??</div>
        <div class="sb-user-info">
          <div class="sb-user-name" id="user-name">Loading…</div>
          <div class="sb-user-role" id="user-role">—</div>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="topbar">
      <div class="tb-title" id="tb-title">Dashboard</div>
      <div class="tb-date" id="tb-date"></div>
      <button class="tb-sync" id="sync-btn" onclick="syncData()">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Sync
      </button>
      <button class="tb-btn" id="add-btn">+ Add</button>
    </div>
    <div id="content">
      <div class="loader"><div class="spin-ring"></div> Connecting to Google Sheets…</div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="modal" style="display:none">
  <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal-box" id="modal-box"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
'use strict';

// ══════════════════════════════════════════════════════════
//  CONFIG — PASTE YOUR APPS SCRIPT WEB APP URL HERE
// ══════════════════════════════════════════════════════════
let API_URL = localStorage.getItem('amms_api_url') || '';

// ══════════════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════════════
const STATE = {
  page: 'dashboard',
  clients: [], team: [], reports: [], followups: [], contracts: [],
  dashboard: null, alerts: [],
  loaded: {},
  filters: {
    clients:   { search:'', service:'All', priority:'All', manager:'All', status:'All', page:1 },
    reports:   { status:'All', type:'All', manager:'All', page:1 },
    followups: { status:'All', manager:'All', page:1 },
    renewals:  { status:'All', page:1 },
    contracts: { search:'', status:'All', payment:'All', page:1 }
  },

// ══════════════════════════════════════════════════════════
//  API LAYER
// ══════════════════════════════════════════════════════════
async function api(action, params = {}) {
  if (!API_URL) throw new Error('NO_URL');
  const qs = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${API_URL}?${qs}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

async function apiPost(action, payload = {}) {
  if (!API_URL) throw new Error('NO_URL');
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action, ...payload })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

// ══════════════════════════════════════════════════════════
//  DATA LOADING
// ══════════════════════════════════════════════════════════
async function loadAll() {
  if (!API_URL) { renderConfigBanner(); return; }
  setSyncing(true);
  try {
    const [dash, clients, team, reports, followups, contracts, alerts] = await Promise.all([
      api('getDashboard'),
      api('getClients'),
      api('getTeam'),
      api('getReports'),
      api('getFollowUps'),
      api('getContracts'),
      api('getAlerts')
    ]);
    STATE.dashboard  = dash;
    STATE.clients    = clients;
    STATE.team       = team;
    STATE.reports    = reports;
    STATE.followups  = followups;
    STATE.contracts  = contracts;
    STATE.alerts     = alerts;
    updateBadges();
    renderPage();
    toast('Synced with Google Sheets', 'success');
  } catch(e) {
    console.error(e);
    if (e.message === 'NO_URL') { renderConfigBanner(); return; }
    toast('Sync failed: ' + e.message, 'error');
    renderPage(); // render with empty state
  } finally {
    setSyncing(false);
  }
}

async function syncData() {
  STATE.loaded = {};
  await loadAll();
}

  if (f.status !== 'All')  rows = rows.filter(r => r.contractStatus === f.status);
  if (f.payment !== 'All') rows = rows.filter(r => r.paymentStatus  === f.payment);

  const total = rows.length;
  const pages = Math.ceil(total / STATE.PER_PAGE) || 1;
  if (f.page > pages) f.page = pages;
  const slice = rows.slice((f.page - 1) * STATE.PER_PAGE, f.page * STATE.PER_PAGE);

  const active     = STATE.contracts.filter(c => c.contractStatus === 'Active').length;
  const lost       = STATE.contracts.filter(c => c.contractStatus === 'Lost').length;
  const renewed    = STATE.contracts.filter(c => c.contractStatus === 'Renewed').length;
  const overduePay = STATE.contracts.filter(c => c.paymentStatus  === 'Overdue').length;
  const totalRev   = STATE.contracts.reduce((s, c) => s + (c.paidAmount||0), 0);
  const totalRem   = STATE.contracts.filter(c => c.paymentStatus !== 'Paid').reduce((s, c) => s + (c.remaining||0), 0);
  const fmtEGP = n => 'EGP ' + Math.round(n).toLocaleString('en');

  const el = document.getElementById('content');
  el.innerHTML = `
  ${overduePay > 0 ? `<div class="alert-bar alert-danger">${iconWarn()} ${overduePay} clients with overdue payments — ${fmtEGP(totalRem)} uncollected</div>` : ''}
  ${lost > 0 ? `<div class="alert-bar alert-warn">${iconWarn()} ${lost} lost client${lost>1?'s':''} — review with Head of Account</div>` : ''}
  <div class="stat-grid g-5" style="margin-bottom:12px">
    ${statCard('Active', active, 'Running contracts', 'si-green', iconCheck())}
    ${statCard('Renewed', renewed, fmtEGP(STATE.contracts.filter(c=>c.contractStatus==='Renewed').reduce((s,c)=>s+(c.totalValue||0),0)), 'si-vip', iconRefresh())}
    ${statCard('Lost', lost, 'Lost clients', 'si-danger', iconX())}
    ${statCard('Overdue Pay', overduePay, fmtEGP(totalRem)+' remaining', 'si-danger', iconMoney())}
    ${statCard('On Hold', STATE.contracts.filter(c=>c.contractStatus==='On Hold').length, 'Paused', 'si-warn', iconClock())}
  </div>
  <div class="stat-grid g-3" style="margin-bottom:16px">
    ${statCard('Total Collected', fmtEGP(totalRev), 'All-time paid amount', 'si-green', iconMoney())}
    ${statCard('Monthly Revenue', fmtEGP(STATE.dashboard?.monthlyRevenue||0), 'From active contracts', 'si-blue', iconMoney())}
    ${statCard('Total Remaining', fmtEGP(totalRem), 'Unpaid invoices', 'si-danger', iconMoney())}
  </div>
  <div class="chart-grid" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><div class="card-title">Contract Status</div></div><div style="height:180px;position:relative"><canvas id="cch1"></canvas></div></div>
    <div class="card"><div class="card-head"><div class="card-title">Payment Status</div></div><div style="height:180px;position:relative"><canvas id="cch2"></canvas></div></div>
  </div>
  <div class="tbl-wrap">
    <div class="tbl-head">
      <div class="tbl-title">Contracts Registry <span style="color:var(--muted);font-weight:400">(${total})</span></div>
      <div class="tbl-controls">
        <input type="text" placeholder="Search client…" value="${esc(f.search)}" oninput="STATE.filters.contracts.search=this.value;STATE.filters.contracts.page=1;renderContracts()">
        ${sel('Status', ['All','Active','On Hold','Renewed','Lost','Cancelled'], f.status, "STATE.filters.contracts.status=this.value;STATE.filters.contracts.page=1;renderContracts()")}
        ${sel('Payment', ['All','Paid','Pending','Overdue','Partially Paid'], f.payment, "STATE.filters.contracts.payment=this.value;STATE.filters.contracts.page=1;renderContracts()")}
      </div>
    </div>
    <div class="tbl-scroll"><table>
      <thead><tr>
        <th>Client</th><th>Service</th><th>Manager</th><th>Contract</th><th>Payment Type</th>
        <th>Renewal</th><th>Next Payment</th><th>Payment</th>
        <th>Total</th><th>Paid</th><th>Remaining</th><th>Lost Reason</th><th>Actions</th>
      </tr></thead>
      <tbody>
        ${slice.length ? slice.map(c => `<tr class="${c.paymentStatus==='Overdue'||c.contractStatus==='Lost'?'row-danger':c.contractStatus==='On Hold'?'row-warn':''}">
          <td style="font-weight:600">${esc(c.clientName)}${c.priority==='VIP'?` <span class="badge b-vip" style="font-size:9px;padding:1px 5px">VIP</span>`:''}}</td>
          <td>${svcBadge(c.service)}</td>
          <td style="font-size:12px">${esc(c.accountManager)}</td>
          <td>${contractStatusBadge(c.contractStatus)}</td>
          <td style="font-size:11.5px;color:var(--muted)">${c.paymentType}</td>
          <td style="font-family:var(--mono);font-size:12px">${c.renewalDate||'—'}</td>
          <td style="font-family:var(--mono);font-size:12px;font-weight:600;color:${c.nextPayDate && c.nextPayDate < today()?'var(--danger)':'var(--text)'}">${c.nextPayDate||'—'}</td>
          <td>${payStatusBadge(c.paymentStatus)}</td>
          <td style="font-family:var(--mono);font-size:12px">EGP ${(c.totalValue||0).toLocaleString()}</td>
          <td style="font-family:var(--mono);font-size:12px;color:var(--success)">EGP ${(c.paidAmount||0).toLocaleString()}</td>
          <td style="font-family:var(--mono);font-size:12px;color:${(c.remaining||0)>0?'var(--danger)':'var(--success)'};font-weight:600">EGP ${(c.remaining||0).toLocaleString()}</td>
          <td style="font-size:11.5px;color:var(--danger);max-width:130px;overflow:hidden;text-overflow:ellipsis">${esc(c.lostReason)||'—'}</td>
          <td><button class="btn btn-cancel" style="padding:4px 10px;font-size:11px" onclick='openEditContract(${JSON.stringify(c)})'>Edit</button></td>
        </tr>`).join('') : `<tr><td colspan="13"><div class="empty"><div class="empty-icon">📋</div>No contracts found</div></td></tr>`}
      </tbody>
    </table></div>
    ${renderPagination(f.page, pages, "STATE.filters.contracts.page=N;renderContracts()", total)}
  </div>`;

  setTimeout(() => {
    const cStatuses = ['Active','Renewed','Lost','On Hold','Cancelled'];
    mkChart('cch1','doughnut', cStatuses,
      [{ data: cStatuses.map(s => STATE.contracts.filter(c=>c.contractStatus===s).length),
         backgroundColor: ['#059669','#7c3aed','#dc2626','#d97706','#94a3b8'], borderWidth:2 }],
      { legend:'right' });
    const pStatuses = ['Paid','Pending','Overdue','Partially Paid'];
    mkChart('cch2','bar', pStatuses,
      [{ data: pStatuses.map(s => STATE.contracts.filter(c=>c.paymentStatus===s).length),
         backgroundColor:['#059669','#d97706','#dc2626','#2563eb'], borderRadius:4 }],
      { legend:false });
  }, 80);
}

// ══════════════════════════════════════════════════════════
//  PERFORMANCE
// ══════════════════════════════════════════════════════════
function renderPerformance() {
  const d = STATE.dashboard;
  const el = document.getElementById('content');
  if (!d || !d.managerStats) { el.innerHTML = loader(); return; }

  const mgrStats = d.managerStats.map(m => {
    const score = Math.min(100, Math.round(
      (m.clients / (m.capacity || 10)) * 40 +
      (m.submitted / Math.max(m.submitted + m.delayed + m.pending, 1)) * 60
    ));
    return { ...m, score };
  }).sort((a, b) => b.score - a.score);

  el.innerHTML = `
  <div class="chart-grid" style="margin-bottom:16px">
    <div class="card"><div class="card-head"><div class="card-title">Clients per Manager</div></div><div style="height:200px;position:relative"><canvas id="p1"></canvas></div></div>
    <div class="card"><div class="card-head"><div class="card-title">Report Completion Rate</div></div><div style="height:200px;position:relative"><canvas id="p2"></canvas></div></div>
  </div>
  <div class="card">
    <div class="card-head"><div class="card-title">Manager Scorecard</div></div>
    ${mgrStats.map((m, i) => `
    <div class="mgr-row">
      <div class="mgr-av" style="background:${PALETTE[i % PALETTE.length]}">${m.name.split(' ').map(w=>w[0]).join('').slice(0,2)}</div>
      <div class="mgr-info">
        <div class="mgr-name">${m.name} <span style="font-size:11px;color:var(--muted);font-weight:400">${m.role}</span></div>
        <div class="mgr-sub">Score: ${m.score}% · Capacity: ${m.clients}/${m.capacity}</div>
        <div class="pbar"><div class="pfill" style="width:${m.score}%;background:${m.score>=80?'var(--success)':m.score>=60?'var(--warn)':'var(--danger)'}"></div></div>
      </div>
      <div class="mgr-nums">
        <div class="mgr-num"><div class="mgr-num-val">${m.clients}</div><div class="mgr-num-lbl">Clients</div></div>
        <div class="mgr-num"><div class="mgr-num-val" style="color:var(--vip)">${m.vip}</div><div class="mgr-num-lbl">VIP</div></div>
        <div class="mgr-num"><div class="mgr-num-val" style="color:var(--success)">${m.submitted}</div><div class="mgr-num-lbl">Submitted</div></div>
        <div class="mgr-num"><div class="mgr-num-val" style="color:var(--danger)">${m.delayed}</div><div class="mgr-num-lbl">Delayed</div></div>
      </div>
    </div>`).join('')}
  </div>`;

  setTimeout(() => {
    const names  = mgrStats.map(m => m.name.split(' ')[0]);
    const colors = mgrStats.map((_, i) => PALETTE[i % PALETTE.length]);
    mkChart('p1','bar', names, [{ label:'Clients', data: mgrStats.map(m=>m.clients), backgroundColor: colors, borderRadius:4 }], { legend:false });
    const rates = mgrStats.map(m => Math.round(m.submitted / Math.max(m.submitted+m.delayed+m.pending,1) * 100));
    mkChart('p2','bar', names, [{
      label:'Completion %',
      data: rates,
      backgroundColor: rates.map(r => r>=80?'#059669':r>=60?'#d97706':'#dc2626'),
      borderRadius:4
    }], { legend:false, yMax:100, yCallback: v=>v+'%' });
  }, 80);
}

  if (page === 'clients')    openAddClientModal();
  else if (page === 'reports')    openAddReportModal();
  else if (page === 'followups')  openAddFollowUpModal();
  else if (page === 'contracts')  openAddContractModal();
  else if (page === 'team')       openAddTeamModal();
}

async function saveClient() {
  const mgrId   = v('f-mgr');
  const mgrObj  = STATE.team.find(t => t.id === mgrId);
  const data = {
    clientName:       v('f-cname'),
    companyName:      v('f-company'),
    phone:            v('f-phone'),
    clientRole:       v('f-role'),
    service:          v('f-service'),
    package:          v('f-package'),
    priority:         v('f-priority'),
    accountManagerId: mgrId,
    accountManager:   mgrObj?.name || '',
    renewalType:      v('f-renewal'),
    monthlyFee:       v('f-fee'),
    startDate:        v('f-start'),
    nextFollowup:     v('f-followup'),
    notes:            v('f-notes')
  };
  if (!data.clientName || !data.service || !data.startDate) { toast('Fill required fields *', 'error'); return; }
  try {
    await apiPost('addClient', { data });
    toast('Client added ✓', 'success');
    closeModal();
    await syncData();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function markReportSubmitted(id) {
  try {
    await apiPost('updateReport', { id, data: { status: 'Submitted' } });
    const r = STATE.reports.find(x => x.id === id);
    if (r) r.status = 'Submitted';
    renderReports();
    toast('Report marked submitted ✓', 'success');
    syncData();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

async function markFollowupDone(id) {
  try {
    await apiPost('updateFollowUp', { id, data: { status: 'Done', lastContact: today() } });
    const f = STATE.followups.find(x => x.id === id);
    if (f) f.status = 'Done';
    renderFollowups();
    toast('Follow-up marked done ✓', 'success');
    syncData();
  } catch(e) { toast('Error: ' + e.message, 'error'); }
}

// ══════════════════════════════════════════════════════════
//  MODAL HELPERS
// ══════════════════════════════════════════════════════════
function setModal(title, bodyHtml, onSave) {
  document.getElementById('modal-box').innerHTML = `
    <div class="modal-title">${title} <span class="modal-close" onclick="closeModal()">×</span></div>
    ${bodyHtml}
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" id="modal-save-btn">Save</button>
    </div>`;
  document.getElementById('modal-save-btn').onclick = async () => {
    const btn = document.getElementById('modal-save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try { await onSave(); } catch(e) { toast('Error: ' + e.message, 'error'); btn.disabled=false; btn.textContent='Save'; }
  };
  document.getElementById('modal').style.display = 'block';
}

function closeModal() { document.getElementById('modal').style.display = 'none'; }

// ══════════════════════════════════════════════════════════
//  CHART HELPER
// ══════════════════════════════════════════════════════════
const CHARTS = {};
function destroyCharts() { Object.values(CHARTS).forEach(c => { try { c.destroy(); } catch(_){} }); Object.keys(CHARTS).forEach(k => delete CHARTS[k]); }
function mkChart(id, type, labels, datasets, opts = {}) {
  const el = document.getElementById(id);
  if (!el) return;
  CHARTS[id] = new Chart(el, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: opts.legend === false ? { display: false } : { position: opts.legend || 'top', labels: { font: { size: 10 }, boxWidth: 12 } }
      },
      scales: type === 'doughnut' ? undefined : {
        y: { beginAtZero: true, max: opts.yMax, ticks: { font: { size: 10 }, callback: opts.yCallback } },
        x: { ticks: { font: { size: 9 } } }
      }
    }
  });
}

// ══════════════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════════════
function loader() { return `<div class="loader"><div class="spin-ring"></div> Loading…</div>`; }
function toast(msg, type = 'info') {
  const el = document.getElementById('toast');
  const item = document.createElement('div');
  item.className = `toast-item toast-${type}`;
  item.textContent = msg;
  el.appendChild(item);
  setTimeout(() => item.remove(), 3200);
}
function setSyncing(on) {
  const btn = document.getElementById('sync-btn');
  btn.classList.toggle('syncing', on);
  btn.textContent = on ? ' Syncing…' : ' Sync';
}
function setText(id, val) { const el = document.getElementById(id); if (el) el.textContent = val; }
function v(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function today() { return new Date().toISOString().slice(0, 10); }
function daysDiff(d) { if (!d) return 9999; return Math.round((new Date(d) - new Date()) / 86400000); }

function sel(label, opts, current, onchange) {
  return `<select onchange="${onchange}">${opts.map(o => `<option value="${o}" ${current===o?'selected':''}>${o}</option>`).join('')}</select>`;
}

function statCard(label, val, sub, iconCls, iconSvg) {
  return `<div class="stat-card">
    <div class="stat-icon ${iconCls}">${iconSvg}</div>
    <div class="stat-label">${label}</div>
    <div class="stat-val">${val}</div>
    <div class="stat-sub">${sub}</div>
  </div>`;
}

function renderPagination(page, pages, handler, total) {
  if (pages <= 1) return '';
  const btns = Array.from({ length: Math.min(pages, 8) }, (_, i) =>
    `<button class="pg-btn ${i+1===page?'active':''}" onclick="${handler.replace('N', i+1)}">${i+1}</button>`
  ).join('');
  return `<div class="pagination">
    <span>Page ${page} of ${pages} · ${total} records</span>
    <span style="margin-left:auto;display:flex;gap:4px">${btns}</span>
  </div>`;
}

function renderAlertBars(alerts) {
  if (!alerts.length) return '';
  return alerts.map(a => `<div class="alert-bar alert-${a.type}">${a.type==='danger'?iconWarn():iconWarn()} ${esc(a.message)}</div>`).join('');
}

  const el = document.getElementById('content');

      Paste your Apps Script Web App URL below to connect the dashboard to your live Google Sheets database.
    </p>
    <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
      <input type="text" id="api-url-input" placeholder="https://script.google.com/macros/s/…/exec" style="min-width:360px;padding:10px 14px;font-size:13px;border:2px solid var(--border);border-radius:var(--r)">
      <button class="btn btn-save" onclick="setApiUrl()">Connect</button>
    </div>
    <div style="margin-top:32px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;text-align:left">

        <li>Run <code style="background:var(--bg);padding:1px 6px;border-radius:4px">setupAll()</code> once to build all sheets</li>
        <li>Deploy → New Deployment → Web App → <strong>Anyone</strong></li>
        <li>Copy the Web App URL and paste it above</li>
      </ol>

}

function setApiUrl() {
  const url = document.getElementById('api-url-input')?.value?.trim();
  if (!url || !url.startsWith('https://script.google.com')) {
    toast('Enter a valid Apps Script URL', 'error'); return;
  }
  API_URL = url;
  localStorage.setItem('amms_api_url', url);
  toast('URL saved — connecting…', 'info');
  loadAll();
}

  new Date().toLocaleDateString('en-GB', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

document.getElementById('sync-btn').addEventListener('contextmenu', e => {
  e.preventDefault();

    localStorage.removeItem('amms_api_url');
